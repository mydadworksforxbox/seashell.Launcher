[package]
name = "seashell-player-launcher"
version = "1.6.5"
edition = "2021"

[[bin]]
name = "SeashellPlayerLauncher"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
term_size = "0.3.2"
colored = "2.0.4"
chrono = "0.4.26"
dirs = "5.0.1"
indicatif = "0.17.6"
reqwest = { version = "0.11.20", features = ["stream"]}
futures = "0.3.28"
tokio = { version = "1.32.0", features=["full"]}
futures-util = "0.3.28"
zip = "0.6.6"
# Pinned to the same version already resolved transitively (via pbkdf2, see Cargo.lock) so this
# does not pull in a new dependency version.
sha2 = "0.10.7"
serde_json = "1.0.105"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.51.0"
windows-sys = { version = "0.48.0", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
chrono = "0.4.26"
winres = "0.1.12"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
